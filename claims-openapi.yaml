openapi: 3.1.0

info:
  title: Claim status
  version: 1.0.0-oas3.1-oas3-oas3.1
  description: >-
    API модуля претензионной работы. Позволяет переводить претензионное дело по
    статусам

servers:
  - url: https://api.techno-import.example/claims/v1
    description: Production
  - url: https://test-api.techno-import.example/claims/v1
    description: Test
tags:
  - name: Claims
    description: Работа с претензионными делами

paths:
  /claims/{claimId}/transitions:
    post:
      tags:
        - Claims
      operationId: transitionClaimStatus
      summary: Перевести претензионное дело в другой статус

      parameters:
        - name: claimId
          in: path
          required: true
          description: Номер претензионного дела
          schema:
            type: string
            pattern: '^CLM-\d{4}-\d{6}$'
          example: CLM-2026-123456
      responses:
        '200':
          description: Статус успешно изменен
